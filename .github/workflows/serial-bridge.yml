name: Mi Android - Compilar y probar puente ARM64
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/serial-bridge.yml'
      - 'android16-build/serial-bridge.c'
      - 'android16-build/test-serial-bridge.py'
permissions:
  contents: read
jobs:
  bridge:
    if: github.repository_owner == 'JuanPabloRC3901' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar sólo prueba efímera en GitHub
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-user
      - name: Compilar puente ARM64 con NDK ya preinstalado
        run: |
          ndk="${ANDROID_NDK_HOME:-${ANDROID_NDK:-}}"
          cc="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"
          test -x "$cc"
          "$cc" -static -O2 -Wall -Wextra -Werror -Wl,-z,max-page-size=16384 android16-build/serial-bridge.c -o miao-bridge-arm64
          "$cc" -static -O2 -Wall -Wextra -Werror '-DMIAO_UPLOAD_DIR="/tmp/miao-bridge-ci"' android16-build/serial-bridge.c -o miao-bridge-test
      - name: Verificar binario ARM64 y transferencia por terminal real
        run: |
          qemu-aarch64 ./miao-bridge-arm64 --self-test
          python3 android16-build/test-serial-bridge.py ./miao-bridge-test /tmp/miao-bridge-ci
# Compilación y protocolo. No es hosting ni prueba Android.
